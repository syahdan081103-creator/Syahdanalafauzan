<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Daftar Event & Seminar</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        .logo i {
            font-size: 1.8rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 50px;
            padding: 0.5rem 1rem;
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            background: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
        }

        .search-box i {
            color: var(--gray);
        }

        /* Filter Section */
        .filter-section {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .filter-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 0.5rem 1.2rem;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .view-toggle {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
            background: rgba(255,255,255,0.2);
            padding: 0.3rem;
            border-radius: 10px;
        }

        .view-btn {
            padding: 0.5rem 0.8rem;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .view-btn.active {
            background: white;
            color: var(--primary);
        }

        /* Stats */
        .stats-bar {
            max-width: 1200px;
            margin: 1rem auto;
            padding: 0 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.9);
            padding: 1rem 1.5rem;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 150px;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .stat-icon.blue { background: #dbeafe; color: #2563eb; }
        .stat-icon.pink { background: #fce7f3; color: #db2777; }
        .stat-icon.green { background: #d1fae5; color: #059669; }

        .stat-info h4 {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .stat-info p {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        /* Main Content */
        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Grid View */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        /* List View */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.5s ease;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .event-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .event-card.list-view {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .event-card.list-view .event-image {
            width: 280px;
            min-height: 200px;
        }

        .event-card.list-view .event-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .event-image {
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .event-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .event-card:hover .event-image img {
            transform: scale(1.1);
        }

        .event-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        .badge-tech { background: #dbeafe; color: #1e40af; }
        .badge-business { background: #fce7f3; color: #9d174d; }
        .badge-design { background: #d1fae5; color: #065f46; }
        .badge-marketing { background: #fef3c7; color: #92400e; }

        .event-date {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.95);
            padding: 0.6rem;
            border-radius: 12px;
            text-align: center;
            min-width: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .event-date .day {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .event-date .month {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
        }

        .event-content {
            padding: 1.5rem;
        }

        .event-category {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: #f1f5f9;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .event-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .event-desc {
            color: var(--gray);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .event-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .event-meta i {
            color: var(--primary);
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
        }

        .event-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .event-price .original {
            font-size: 0.85rem;
            color: var(--gray);
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 0.5rem;
        }

        .btn-register {
            padding: 0.6rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-register:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-register.registered {
            background: #10b981;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 2rem 2rem 1rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .modal-header h2 {
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .modal-body {
            padding: 1.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .modal-footer {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: #e2e8f0;
            transform: rotate(90deg);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transform: translateX(120%);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 350px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .toast-icon.success { background: #d1fae5; color: #059669; }
        .toast-icon.error { background: #fee2e2; color: #dc2626; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: white;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.8);
            margin-top: 3rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .nav-container {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .event-card.list-view {
                flex-direction: column;
            }

            .event-card.list-view .event-image {
                width: 100%;
                height: 200px;
            }

            .view-toggle {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }

            .filter-container {
                justify-content: center;
            }

            .modal {
                width: 95%;
                margin: 1rem;
            }

            .toast-container {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
            }

            .toast {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .event-meta {
                flex-direction: column;
                gap: 0.5rem;
            }

            .event-footer {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .btn-register {
                justify-content: center;
            }
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 12px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fas fa-calendar-star"></i>
                <span>EventHub</span>
            </a>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari event atau seminar...">
            </div>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="fas fa-calendar-check"></i>
            </div>
            <div class="stat-info">
                <h4>Total Event</h4>
                <p id="totalEvents">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon pink">
                <i class="fas fa-users"></i>
            </div>
            <div class="stat-info">
                <h4>Total Peserta</h4>
                <p id="totalPeserta">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">
                <i class="fas fa-tag"></i>
            </div>
            <div class="stat-info">
                <h4>Kategori</h4>
                <p id="totalKategori">0</p>
            </div>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="Tech">Teknologi</button>
            <button class="filter-btn" data-filter="Business">Bisnis</button>
            <button class="filter-btn" data-filter="Design">Desain</button>
            <button class="filter-btn" data-filter="Marketing">Marketing</button>
            
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" title="Grid View">
                    <i class="fas fa-th-large"></i>
                </button>
                <button class="view-btn" data-view="list" title="List View">
                    <i class="fas fa-list"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-container">
        <div id="eventsContainer" class="events-grid">
            <!-- Events will be rendered here -->
        </div>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-search"></i>
            <h3>Event tidak ditemukan</h3>
            <p>Coba kata kunci atau filter lainnya</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p> EventHub - Platform Event & Seminar Indonesia</p>
    </footer>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" style="position: relative;">
            <button class="close-modal" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-header">
                <h2>Daftar Event</h2>
                <p id="modalEventTitle" style="color: var(--gray);">Nama Event</p>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" id="regName" required placeholder="Masukkan nama lengkap">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" required placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label>No. Telepon</label>
                        <input type="tel" id="regPhone" required placeholder="08xxxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Tiket</label>
                        <select id="regTicket">
                            <option value="early">Early Bird (Diskon 30%)</option>
                            <option value="regular" selected>Regular</option>
                            <option value="vip">VIP (Akses Eksklusif)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
                <button class="btn btn-primary" onclick="submitRegistration()">
                    <i class="fas fa-check"></i> Konfirmasi
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

                image: "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?w=800",
                attendees: 200,
                badge: "badge-business",
                badgeText: "Business"
            },
            {
                id: 5,
                title: "Cybersecurity Fundamentals",
                description: "Seminar keamanan siber untuk pemula. Memahami ancaman digital dan cara melindungi data organisasi.",
                category: "Tech",
                date: "2024-08-10",
                time: "09:00 - 15:00",
                location: "Online (Zoom)",
                price: 200000,
                originalPrice: 350000,
                image: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=800",
                attendees: 350,
                badge: "badge-tech",
                badgeText: "Tech"
            },
            {
                id: 6,
                title: "Brand Strategy Workshop",
                description: "Membangun brand yang kuat dan berkesan. Studi kasus dari brand-brand ternama Indonesia.",
                category: "Marketing",
                date: "2024-08-15",
                time: "10:00 - 17:00",
                location: "Yogyakarta Creative Center",
                price: 550000,
                originalPrice: 750000,
                image: "https://images.unsplash.com/photo-1432888622747-4eb9a8efeb07?w=800",
                attendees: 150,
                badge: "badge-marketing",
                badgeText: "Marketing"
            }
        ];

        // State
        let currentFilter = 'all';
        let currentView = 'grid';
        let searchQuery = '';
        let registeredEvents = new Set();
        let selectedEventId = null;

        // DOM Elements
        const container = document.getElementById('eventsContainer');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderEvents();
            updateStats();
            setupEventListeners();
        });

        // Setup Event Listeners
        function setupEventListeners() {
            // Search
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderEvents();
            });

            // Filter Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderEvents();
                });
            });

            // View Toggle
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentView = btn.dataset.view;
                    renderEvents();
                });
            });

            // Close modal on overlay click
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        // Format Currency
        function formatRupiah(angka) {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        // Format Date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            return {
                day: date.getDate(),
                month: months[date.getMonth()],
                full: date.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
            };
        }

        // Filter Events
        function getFilteredEvents() {
            return eventsData.filter(event => {
                const matchCategory = currentFilter === 'all' || event.category === currentFilter;
                const matchSearch = event.title.toLowerCase().includes(searchQuery) || 
                                  event.description.toLowerCase().includes(searchQuery) ||
                                  event.location.toLowerCase().includes(searchQuery);
                return matchCategory && matchSearch;
            });
        }

        // Render Events
        function renderEvents() {
            const filtered = getFilteredEvents();
            
            if (filtered.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            container.style.display = 'block';
            emptyState.style.display = 'none';
            
            // Update container class
            container.className = currentView === 'grid' ? 'events-grid' : 'events-list';

            container.innerHTML = filtered.map(event => {
                const date = formatDate(event.date);
                const isRegistered = registeredEvents.has(event.id);
                
                return `
                    <div class="event-card ${currentView === 'list' ? 'list-view' : ''}" data-aos="fade-up">
                        <div class="event-image">
                            <img src="${event.image}" alt="${event.title}" loading="lazy">
                            <span class="event-badge ${event.badge}">${event.badgeText}</span>
                            <div class="event-date">
                                <div class="day">${date.day}</div>
                                <div class="month">${date.month}</div>
                            </div>
                        </div>
                        <div class="event-content">
                            <span class="event-category">${event.category}</span>
                            <h3 class="event-title">${event.title}</h3>
                            <p class="event-desc">${event.description}</p>
                            <div class="event-meta">
                                <span><i class="far fa-clock"></i> ${event.time}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${event.location}</span>
                                <span><i class="fas fa-users"></i> ${event.attendees} peserta</span>
                            </div>
                            <div class="event-footer">
                                <div class="event-price">
                                    ${formatRupiah(event.price)}
                                    <span class="original">${formatRupiah(event.originalPrice)}</span>
                                </div>
                                <button class="btn-register ${isRegistered ? 'registered' : ''}" 
                                        onclick="${isRegistered ? '' : `openModal(${event.id})`}"
                                        ${isRegistered ? 'disabled' : ''}>
                                    <i class="fas ${isRegistered ? 'fa-check' : 'fa-ticket-alt'}"></i>
                                    ${isRegistered ? 'Terdaftar' : 'Daftar'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update Stats
        function updateStats() {
            const totalEvents = eventsData.length;
            const totalPeserta = eventsData.reduce((sum, e) => sum + e.attendees, 0);
            const categories = [...new Set(eventsData.map(e => e.category))].length;

            animateValue('totalEvents', 0, totalEvents, 1000);
            animateValue('totalPeserta', 0, totalPeserta, 1500);
            animateValue('totalKategori', 0, categories, 800);
        }

        // Animate Number
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            const range = end - start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));
            let current = start;
            
            const timer = setInterval(() => {
                current += increment * Math.ceil(range / (duration / 16));
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    current = end;
                    clearInterval(timer);
                }
                obj.textContent = current.toLocaleString('id-ID');
            }, 16);
        }

        // Modal Functions
        function openModal(eventId) {
            selectedEventId = eventId;
            const event = eventsData.find(e => e.id === eventId);
            document.getElementById('modalEventTitle').textContent = event.title;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('registerForm').reset();
            selectedEventId = null;
        }

        function submitRegistration() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;

            if (!name || !email || !phone) {
                showToast('Mohon lengkapi semua data', 'error');
                return;
            }

            // Simulate registration
            registeredEvents.add(selectedEventId);
            
            // Update attendees count
            const event = eventsData.find(e => e.id === selectedEventId);
            event.attendees++;
            
            showToast(`Berhasil mendaftar di ${event.title}!`, 'success');
            closeModal();
            renderEvents();
            updateStats();
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icon = type === 'success' ? 'fa-check' : 'fa-exclamation-circle';
            const iconClass = type === 'success' ? 'success' : 'error';
            
            toast.innerHTML = `
                <div class="toast-icon ${iconClass}">
                    <i class="fas ${icon}"></i>
                </div>
                <div>
                    <strong>${type === 'success' ? 'Sukses!' : 'Error!'}</strong>
                    <p style="margin: 0; font-size: 0.9rem; color: var(--gray);">${message}</p>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe cards after render
        setTimeout(() => {
            document.querySelectorAll('.event-card').forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(card);
            });
        }, 100);
    </script>
</body>
</html>
